# Independent rules for the repair validation layer (Milestone 4 enhancement).
# Every rule comes from domain knowledge, a public reference or the definition of the dataset (CMS Hospital Compare),
# never from the table being cleaned. Column names are those of the dirty table.
table: hospital
missing_tokens: ["empty"]        # the dataset writes a missing value as the word "empty"

columns:
  provider_number: {pattern: '^\d{5,6}$', source: "CMS: a Medicare provider number (CCN) has 6 digits; leading zeros are dropped in this file"}
  zip: {pattern: '^\d{5}$', source: "USPS: a ZIP code has 5 digits"}
  phone: {pattern: '^[2-9]\d{2}[2-9]\d{6}$', source: "NANP: 10 digits; area code and exchange do not start with 0 or 1"}
  state: {allowed_ref: us_states, case: lower, source: "USPS two-letter state and territory codes"}
  emergency_service: {allowed: ["yes", "no"], source: "CMS Hospital Compare: emergency service is yes or no"}
  type: {allowed: ["acute care hospitals", "critical access hospitals", "childrens", "acute care - veterans administration"],
         source: "CMS Hospital Compare hospital types"}
  condition: {allowed: ["heart attack", "heart failure", "pneumonia", "surgical infection prevention", "childrens asthma care"],
              source: "CMS Hospital Compare process-of-care condition groups"}
  measure_code: {pattern: '^(ami|hf|pn|scip|cac)-[a-z0-9-]+$', source: "CMS measure ID prefixes: ami, hf, pn, scip, cac"}
  score: {pattern: '^\d{1,3}%$', range: {min: 0, max: 100, strip: "%"}, missing_ok: true,
          source: "a process-of-care score is a percentage of patients (0 to 100%)"}
  sample: {pattern: '^\d+ patients?$', range: {min: 0, max: 100000, strip: " patients"}, missing_ok: true,
           source: "the sample is a count of patients, written 'N patients'"}
  address_2: {allowed: [], missing_ok: true, source: "unused address line in this release: always empty"}
  address_3: {allowed: [], missing_ok: true, source: "unused address line in this release: always empty"}

relations:
  - kind: fd
    lhs: [provider_number]
    rhs: [name, address_1, city, state, zip, county, phone, type, owner, emergency_service]
    source: "CMS: one provider number identifies one hospital, with one name, address, phone and ownership"
  - kind: fd
    lhs: [measure_code]
    rhs: [measure_name, condition]
    source: "CMS: a measure ID has one measure name and belongs to one condition"
  - kind: fd
    lhs: [zip]
    rhs: [state]
    source: "USPS: a ZIP code lies in one state"
  - kind: concat
    target: state_average
    parts: [state, "_", measure_code]
    source: "column definition: the state-average key is the state code, an underscore and the measure ID"
