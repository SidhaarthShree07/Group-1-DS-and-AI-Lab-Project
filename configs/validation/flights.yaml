# Independent rules for the repair validation layer (Milestone 4 enhancement).
# Flights (Li et al., "Truth finding on the deep web"): several web sources report the times of the same flights.
table: flights
missing_tokens: [""]

columns:
  flight: {pattern: '^[A-Z0-9]{2}-\d{1,4}-[A-Z]{3}-[A-Z]{3}$',
           source: "IATA: airline code, flight number, origin and destination airport codes"}
  sched_dep_time: &time {pattern: '^(1[0-2]|[1-9]):[0-5]\d [ap]\.m\.$', source: "12-hour clock time, as published by the sources"}
  act_dep_time: *time
  sched_arr_time: *time
  act_arr_time: *time

relations:
  - kind: fd
    lhs: [flight]
    rhs: [sched_dep_time, act_dep_time, sched_arr_time, act_arr_time]
    source: "dataset definition: each flight number and route is one flight on one day, with one true time of each kind; the sources disagree only through errors"
