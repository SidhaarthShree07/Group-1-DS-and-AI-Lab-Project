<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <title>Gemma 4 E4B-it text path with LoRA adapters on the attention and MLP projections</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:1.4}
      .frz{fill:#eef1f6;stroke:#64748b;stroke-width:1.2}
      .lora{fill:#e6f4f1;stroke:#0e7a63;stroke-width:1.6}
      .t{font-size:14px;font-weight:700;fill:#121b2d}
      .s{font-size:12px;fill:#334155}
      .g{font-size:12px;fill:#0e7a63;font-weight:600}
      .n{font-size:11.5px;fill:#566073;font-style:italic}
      line,path{stroke:#334155;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <!-- input -->
  <rect class="box" x="20" y="150" width="150" height="100" rx="8"/>
  <text class="t" x="35" y="176">Input</text>
  <text class="s" x="35" y="196">chat-template text</text>
  <text class="s" x="35" y="213">→ token ids</text>
  <text class="s" x="35" y="230">[batch, length ≤ 1,536]</text>

  <rect class="frz" x="200" y="150" width="150" height="100" rx="8"/>
  <text class="t" x="215" y="176">Embeddings</text>
  <text class="s" x="215" y="196">262,144 × 2,560</text>
  <text class="s" x="215" y="213">+ per-layer 256-d</text>
  <text class="s" x="215" y="230">token embeddings</text>

  <!-- decoder layer -->
  <rect class="box" x="380" y="40" width="430" height="320" rx="10"/>
  <text class="t" x="395" y="66">Decoder layer × 42 (frozen base weights)</text>
  <rect class="frz" x="400" y="85" width="190" height="120" rx="6"/>
  <text class="t" x="412" y="108">Attention</text>
  <text class="s" x="412" y="128">8 query heads, 2 key-value</text>
  <text class="s" x="412" y="145">heads, head size 256</text>
  <text class="s" x="412" y="162">sliding window 512 in local</text>
  <text class="s" x="412" y="179">layers, global layers</text>
  <rect class="lora" x="605" y="85" width="190" height="120" rx="6"/>
  <text class="g" x="617" y="108">LoRA on q, k, v, o</text>
  <text class="s" x="617" y="128">W x + (α / r) · B A x</text>
  <text class="s" x="617" y="145">A: r × d_in, B: d_out × r</text>
  <text class="s" x="617" y="162">r = 16, α = 32</text>
  <text class="s" x="617" y="179">dropout 0.05 (trained)</text>
  <rect class="frz" x="400" y="220" width="190" height="120" rx="6"/>
  <text class="t" x="412" y="243">MLP</text>
  <text class="s" x="412" y="263">2,560 → 10,240 → 2,560</text>
  <text class="s" x="412" y="280">gated, GELU (tanh)</text>
  <text class="s" x="412" y="297">RMS normalisation</text>
  <rect class="lora" x="605" y="220" width="190" height="120" rx="6"/>
  <text class="g" x="617" y="243">LoRA on gate, up, down</text>
  <text class="s" x="617" y="263">same form, r = 16</text>
  <text class="s" x="617" y="280">only these adapters</text>
  <text class="s" x="617" y="297">are updated in training</text>
  <line x1="590" y1="145" x2="603" y2="145"/>
  <line x1="590" y1="280" x2="603" y2="280"/>
  <line x1="495" y1="205" x2="495" y2="218" marker-end="url(#a)"/>

  <rect class="frz" x="840" y="150" width="140" height="100" rx="8"/>
  <text class="t" x="855" y="176">Output head</text>
  <text class="s" x="855" y="196">tied embeddings</text>
  <text class="s" x="855" y="213">→ next token</text>
  <text class="s" x="855" y="230">{"is_error": true…</text>

  <line x1="170" y1="200" x2="198" y2="200" marker-end="url(#a)"/>
  <line x1="350" y1="200" x2="378" y2="200" marker-end="url(#a)"/>
  <line x1="810" y1="200" x2="838" y2="200" marker-end="url(#a)"/>
  <text class="n" x="20" y="385">Text path only; the checkpoint's vision and audio encoders are not used. Numbers from the model's config.json.</text>
</svg>
